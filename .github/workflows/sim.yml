name: RTL Simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  async-fifo-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Show simulator version
        run: |
          iverilog -V
          vvp -V

      - name: Run async FIFO smoke test
        working-directory: sim
        run: make clean all SIMULATOR=iverilog
