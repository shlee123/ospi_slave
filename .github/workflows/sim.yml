name: RTL Simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  async-fifo-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Show simulator version
        run: |
          iverilog -V
          vvp -V

      - name: Run async FIFO smoke test
        working-directory: sim
        run: make clean all SIMULATOR=iverilog

      - name: Check parameterized output names
        working-directory: sim
        run: |
          test -f log/tb_ospi_slave__TB_AXI_DATA_WIDTH-8.log
          test -f log/tb_ospi_slave__SINGLE_TRAN-0__TB_4K_BOUNDARY-1__TB_AXI_DATA_WIDTH-8__TB_TEST_ADDRESS-4092.log
          test -x build/iverilog/tb_ospi_slave__TB_AXI_DATA_WIDTH-1024/simv
